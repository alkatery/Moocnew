# ---------------------------------------------------------------------------
# Lightweight TRIAL stack for the MOOC Platform — fits a 2GB VPS.
#
# Drops Meilisearch (search falls back to Scout's in-memory `collection`
# driver) and runs queues synchronously, so only four lean services run:
#
#   app    — PHP-FPM (Laravel 11)
#   web    — Nginx (port 8080)
#   pgsql  — PostgreSQL 16
#   redis  — Redis 7 (cache, sessions)
#
# Use instead of docker-compose.yml:
#   docker compose -f docker-compose.light.yml up -d
# or via the provisioner:  LIGHT=1 bash docs/deploy/setup-vps.sh
# ---------------------------------------------------------------------------
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
      # Trial: no Meilisearch — search runs in-memory; queues run inline.
      SCOUT_DRIVER: collection
      SCOUT_QUEUE: "false"
      QUEUE_CONNECTION: sync
      # AI assistant stays off by default on the trial box (zero cost/RAM).
      AI_DEFAULT_MODE: "off"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  pgsql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mooc}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgsql-data:
  redis-data:
