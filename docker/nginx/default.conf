server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # حدّ حجم جسم الطلب — يجب أن يساوي post_max_size في PHP أو يفوقه، وإلا
    # فُشل رفع الأغلفة/الشعار/ملفات الدروس بـ 413 قبل وصوله إلى التطبيق
    # (الافتراضي 1MB كان يقطع كل رفع أكبر من ذلك).
    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # مُحلِّل Docker الداخلي + تمرير عبر متغيّر: يجعل nginx يُعيد تحليل اسم
        # حاوية app دوريّاً (ضمن TTL)، فلا يتعطّل بـ 502 إذا أُعيد إنشاء app
        # بعنوان IP جديد (نشر/إعادة تشغيل). بدونها يُخزَّن IP قديم ميّت.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
