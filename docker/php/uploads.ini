; حدود رفع الملفات لـ PHP-FPM (app) وCLI (horizon).
; يرفع الافتراضات الصغيرة (2M/8M) التي كانت تُفشل رفع الأغلفة والشعار
; وملفات الدروس (حتى 25MB) قبل أن يصل الطلب إلى Laravel.
; post_max_size أكبر قليلاً من upload_max_filesize لاستيعاب حِمل multipart،
; ويجب أن يساويه أو يفوقه إعداد client_max_body_size في nginx.
upload_max_filesize = 30M
post_max_size = 32M
memory_limit = 256M
max_file_uploads = 20
