# ---------------------------------------------------------------------------
# FULL trial / single-box production stack for the MOOC Platform.
#
# Everything needed for the complete experience on one VPS:
#
#   app       — PHP-FPM (Laravel 11 API)
#   web       — Nginx (API + uploaded media on :8080)
#   horizon   — queue worker (reminders, notifications, search indexing)
#   pgsql     — PostgreSQL 16
#   redis     — Redis 7 (cache, sessions, queues)
#   meilisearch — full-text search
#   frontend  — Next.js UI (:3000)
#
# Bring up with the provisioner:  FULL=1 bash docs/deploy/setup-vps.sh
# or manually:                    docker compose -f docker-compose.full.yml up -d
#
# NEXT_PUBLIC_API_BASE must point at the public API URL the *browser* will
# reach (e.g. http://<server-ip>:8080/api/v1); it is baked into the UI build.
# ---------------------------------------------------------------------------
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
      MEILISEARCH_HOST: http://meilisearch:7700
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
      MEILISEARCH_HOST: http://meilisearch:7700
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080/api/v1}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - web

  pgsql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mooc}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      # The image is Alpine: busybox wget lacks --no-verbose, but curl is
      # explicitly installed — use it (wget -q kept as a fallback).
      test: ["CMD-SHELL", "curl -fs http://localhost:7700/health || wget -q --spider http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgsql-data:
  redis-data:
  meili-data:
